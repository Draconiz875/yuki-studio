<!DOCTYPE html>
<html lang="pt-BR">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>Yuki Studio | Painel</title>

    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

    <style>

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }


        body {

            font-family:
                Arial,
                Helvetica,
                sans-serif;

            min-height: 100vh;

            background:
                #020403;

            color:
                white;

        }


        /* ========================================
           LOGIN
        ======================================== */

        #login {

            min-height: 100vh;

            display: flex;

            align-items: center;

            justify-content: center;

            padding: 20px;

        }


        .login-box {

            width: 100%;

            max-width: 400px;

            padding: 35px;

            border-radius: 20px;

            background:
                #07120c;

            border:
                1px solid rgba(80,255,140,.2);

            box-shadow:
                0 20px 60px rgba(0,0,0,.5);

        }


        .login-box h1 {

            color:
                #5cff98;

            margin-bottom:
                10px;

        }


        .login-box p {

            color:
                #999;

            margin-bottom:
                25px;

        }


        input,
        textarea {

            width:
                100%;

            padding:
                13px;

            margin-bottom:
                12px;

            border-radius:
                10px;

            border:
                1px solid rgba(255,255,255,.12);

            background:
                #020604;

            color:
                white;

            outline:
                none;

        }


        input:focus,
        textarea:focus {

            border-color:
                rgba(80,255,140,.5);

        }


        textarea {

            resize:
                none;

            height:
                80px;

        }


        button {

            border:
                none;

            border-radius:
                10px;

            padding:
                12px 18px;

            cursor:
                pointer;

            font-weight:
                bold;

        }


        .login-button {

            width:
                100%;

            background:
                #36e875;

            color:
                #001b09;

        }


        .login-button:hover {

            background:
                #5cff98;

        }


        #loginError {

            color:
                #ff7777;

            margin-top:
                12px;

            font-size:
                13px;

        }



        /* ========================================
           PAINEL
        ======================================== */

        #painel {

            display:
                none;

            min-height:
                100vh;

        }


        .topbar {

            height:
                70px;

            display:
                flex;

            align-items:
                center;

            justify-content:
                space-between;

            padding:
                0 25px;

            background:
                #07120c;

            border-bottom:
                1px solid rgba(80,255,140,.15);

        }


        .logo {

            color:
                #5cff98;

            font-size:
                20px;

            font-weight:
                bold;

            letter-spacing:
                3px;

        }


        .topbar-info {

            display:
                flex;

            align-items:
                center;

            gap:
                15px;

        }


        .admin-online {

            display:
                flex;

            align-items:
                center;

            gap:
                7px;

            color:
                #75ffab;

            font-size:
                12px;

        }


        .online-dot {

            width:
                8px;

            height:
                8px;

            border-radius:
                50%;

            background:
                #36e875;

            box-shadow:
                0 0 10px #36e875;

        }


        .logout {

            background:
                rgba(255,255,255,.08);

            color:
                #aaa;

        }


        .logout:hover {

            background:
                rgba(255,255,255,.14);

            color:
                white;

        }



        /* ========================================
           LAYOUT
        ======================================== */

        .layout {

            display:
                grid;

            grid-template-columns:
                350px 1fr;

            height:
                calc(100vh - 70px);

        }



        /* ========================================
           LISTA
        ======================================== */

        .atendimentos {

            border-right:
                1px solid rgba(255,255,255,.08);

            overflow-y:
                auto;

            background:
                #030805;

        }


        .lista-header {

            padding:
                18px 20px;

            border-bottom:
                1px solid rgba(255,255,255,.06);

            position:
                sticky;

            top:
                0;

            background:
                #030805;

            z-index:
                2;

        }


        .lista-titulo {

            color:
                #aaa;

            font-size:
                12px;

            letter-spacing:
                1px;

            margin-bottom:
                10px;

        }


        .contador {

            color:
                #5cff98;

            font-size:
                13px;

        }


        .atendimento {

            padding:
                17px 18px;

            border-top:
                1px solid rgba(255,255,255,.05);

            cursor:
                pointer;

            transition:
                .2s;

            position:
                relative;

        }


        .atendimento:hover {

            background:
                rgba(80,255,140,.06);

        }


        .atendimento.selecionado {

            background:
                rgba(80,255,140,.10);

            border-left:
                3px solid #5cff98;

        }


        .atendimento-nome {

            display:
                flex;

            align-items:
                center;

            justify-content:
                space-between;

            gap:
                10px;

            margin-bottom:
                9px;

        }


        .atendimento-nome strong {

            overflow:
                hidden;

            text-overflow:
                ellipsis;

            white-space:
                nowrap;

        }


        .badge {

            font-size:
                10px;

            padding:
                4px 7px;

            border-radius:
                20px;

            white-space:
                nowrap;

        }


        .badge.aguardando {

            background:
                rgba(255,190,60,.12);

            color:
                #ffc85c;

        }


        .badge.atendimento {

            background:
                rgba(54,232,117,.12);

            color:
                #5cff98;

        }


        .badge.encerrado {

            background:
                rgba(255,255,255,.08);

            color:
                #777;

        }


        .atendimento-info {

            display:
                flex;

            flex-direction:
                column;

            gap:
                5px;

            color:
                #888;

            font-size:
                12px;

        }


        .atendimento-info span {

            display:
                flex;

            align-items:
                center;

            gap:
                6px;

        }


        .atendimento-info .atendente {

            color:
                #aaa;

        }



        /* ========================================
           CHAT
        ======================================== */

        .chat {

            display:
                flex;

            flex-direction:
                column;

            min-width:
                0;

        }


        .chat-top {

            padding:
                17px 22px;

            border-bottom:
                1px solid rgba(255,255,255,.08);

            background:
                rgba(7,18,12,.7);

        }


        .chat-cliente {

            display:
                flex;

            align-items:
                center;

            gap:
                12px;

        }


        .cliente-avatar {

            width:
                42px;

            height:
                42px;

            border-radius:
                50%;

            background:
                #102219;

            display:
                flex;

            align-items:
                center;

            justify-content:
                center;

            font-size:
                18px;

        }


        .cliente-dados strong {

            display:
                block;

            margin-bottom:
                4px;

        }


        .cliente-dados span {

            color:
                #5cff98;

            font-size:
                12px;

        }


        #adminMessages {

            flex:
                1;

            overflow-y:
                auto;

            padding:
                25px;

        }


        .msg {

            max-width:
                70%;

            padding:
                12px 15px;

            margin-bottom:
                12px;

            border-radius:
                15px;

            line-height:
                1.5;

            white-space:
                pre-wrap;

            word-break:
                break-word;

        }


        .msg.cliente {

            background:
                #18231d;

            margin-right:
                auto;

            border-bottom-left-radius:
                4px;

        }


        .msg.atendente {

            background:
                #216b3d;

            margin-left:
                auto;

            border-bottom-right-radius:
                4px;

        }


        .msg-horario {

            display:
                block;

            margin-top:
                5px;

            font-size:
                10px;

            opacity:
                .5;

        }


        .resposta {

            display:
                flex;

            gap:
                10px;

            padding:
                15px;

            border-top:
                1px solid rgba(255,255,255,.08);

            background:
                #030805;

        }


        .resposta textarea {

            margin:
                0;

            height:
                55px;

            flex:
                1;

        }


        .enviar {

            background:
                #36e875;

            color:
                #001b09;

            min-width:
                90px;

        }


        .enviar:hover {

            background:
                #5cff98;

        }


        .encerrar {

            background:
                rgba(255,80,80,.12);

            color:
                #ff8a8a;

            margin:
                0 15px 15px;

        }


        .encerrar:hover {

            background:
                rgba(255,80,80,.20);

        }


        .encerrar:disabled,
        .enviar:disabled {

            opacity:
                .4;

            cursor:
                not-allowed;

        }


        .vazio {

            color:
                #666;

            padding:
                25px;

            text-align:
                center;

        }



        /* ========================================
           SCROLLBAR
        ======================================== */

        ::-webkit-scrollbar {

            width:
                7px;

        }


        ::-webkit-scrollbar-track {

            background:
                #020403;

        }


        ::-webkit-scrollbar-thumb {

            background:
                #173622;

            border-radius:
                10px;

        }


        ::-webkit-scrollbar-thumb:hover {

            background:
                #245536;

        }



        /* ========================================
           MOBILE
        ======================================== */

        @media (max-width: 700px) {

            .layout {

                grid-template-columns:
                    1fr;

            }


            .atendimentos {

                display:
                    none;

            }


            .topbar {

                padding:
                    0 15px;

            }


            .admin-online {

                display:
                    none;

            }


            .msg {

                max-width:
                    85%;

            }

        }

    </style>

</head>


<body>


    <!-- ========================================
         LOGIN
    ======================================== -->

    <section id="login">

        <div class="login-box">

            <h1>
                YUKI STUDIO
            </h1>

            <p>
                Painel de atendimento
            </p>


            <input
                type="email"
                id="email"
                placeholder="E-mail"
            >


            <input
                type="password"
                id="senha"
                placeholder="Senha"
            >


            <button
                class="login-button"
                onclick="login()"
            >
                Entrar
            </button>


            <div id="loginError"></div>

        </div>

    </section>



    <!-- ========================================
         PAINEL
    ======================================== -->

    <section id="painel">


        <!-- TOPBAR -->

        <header class="topbar">

            <div class="logo">
                YUKI SUPPORT
            </div>


            <div class="topbar-info">

                <div class="admin-online">

                    <span class="online-dot"></span>

                    Online

                </div>


                <button
                    class="logout"
                    onclick="logout()"
                >
                    Sair
                </button>

            </div>

        </header>



        <main class="layout">


            <!-- ====================================
                 LISTA DE ATENDIMENTOS
            ===================================== -->

            <aside class="atendimentos">


                <div class="lista-header">

                    <div class="lista-titulo">
                        ATENDIMENTOS
                    </div>


                    <div
                        class="contador"
                        id="contadorAtendimentos"
                    >
                        0 atendimentos
                    </div>

                </div>


                <div id="listaAtendimentos">

                    <div class="vazio">

                        Nenhum atendimento ainda.

                    </div>

                </div>

            </aside>



            <!-- ====================================
                 CHAT
            ===================================== -->

            <section class="chat">


                <div class="chat-top">

                    <div class="chat-cliente">


                        <div
                            class="cliente-avatar"
                            id="clienteAvatar"
                        >
                            👤
                        </div>


                        <div class="cliente-dados">

                            <strong id="clienteNome">
                                Selecione um atendimento
                            </strong>


                            <span id="clienteStatus">
                                Aguardando seleção
                            </span>

                        </div>

                    </div>

                </div>



                <div id="adminMessages">

                    <div class="vazio">

                        Selecione um cliente
                        para visualizar a conversa.

                    </div>

                </div>



                <button
                    class="encerrar"
                    id="botaoEncerrar"
                    onclick="encerrarAdmin()"
                    disabled
                >
                    ✓ Encerrar atendimento
                </button>



                <div class="resposta">

                    <textarea
                        id="resposta"
                        placeholder="Digite sua resposta..."
                        disabled
                    ></textarea>


                    <button
                        class="enviar"
                        id="botaoEnviar"
                        onclick="enviarResposta()"
                        disabled
                    >
                        Enviar
                    </button>

                </div>


            </section>

        </main>

    </section>



<script>


/* =========================================
   SUPABASE
========================================= */

const SUPABASE_URL =
    "https://moaeniuahyipcklspjbs.supabase.co";


const SUPABASE_KEY =
    "sb_publishable_DZ_bN0dLHYZ9LbBJR5vB7Q_viUUgnvQ";


const db =
    window.supabase.createClient(
        SUPABASE_URL,
        SUPABASE_KEY
    );


let atendimentoSelecionado =
    null;

let canalAdmin =
    null;



/* =========================================
   LOGIN
========================================= */

async function login() {

    const email =
        document
            .getElementById("email")
            .value
            .trim();


    const senha =
        document
            .getElementById("senha")
            .value;


    const erro =
        document
            .getElementById("loginError");


    erro.textContent =
        "";


    const {
        data,
        error
    } = await db.auth.signInWithPassword({

        email:
            email,

        password:
            senha

    });


    if (error) {

        erro.textContent =
            "E-mail ou senha incorretos.";

        return;

    }


    document
        .getElementById("login")
        .style.display =
        "none";


    document
        .getElementById("painel")
        .style.display =
        "block";


    carregarAtendimentos();

}



/* =========================================
   LOGOUT
========================================= */

async function logout() {

    if (canalAdmin) {

        await db.removeChannel(
            canalAdmin
        );

        canalAdmin =
            null;

    }


    await db.auth.signOut();


    location.reload();

}



/* =========================================
   CARREGAR ATENDIMENTOS
========================================= */

async function carregarAtendimentos() {

    const {

        data,
        error

    } = await db

        .from("atendimentos")

        .select("*")

        .order(
            "criado_em",
            {
                ascending:
                    false
            }
        );


    if (error) {

        console.error(
            "Erro ao carregar atendimentos:",
            error
        );

        return;

    }


    const lista =
        document.getElementById(
            "listaAtendimentos"
        );


    lista.innerHTML =
        "";


    const contador =
        document.getElementById(
            "contadorAtendimentos"
        );


    contador.textContent =
        data.length +
        (
            data.length === 1
                ? " atendimento"
                : " atendimentos"
        );


    if (!data.length) {

        lista.innerHTML =
            '<div class="vazio">Nenhum atendimento ainda.</div>';

        return;

    }


    data.forEach(
        atendimento => {

            const item =
                document.createElement(
                    "div"
                );


            item.className =
                "atendimento";


            if (
                atendimentoSelecionado &&
                atendimentoSelecionado.id ===
                atendimento.id
            ) {

                item.classList.add(
                    "selecionado"
                );

            }


            const status =
                atendimento.status ||
                "aguardando";


            let textoStatus =
                "Aguardando";


            let classeStatus =
                "aguardando";


            if (
                status ===
                "em_atendimento"
            ) {

                textoStatus =
                    "Em atendimento";

                classeStatus =
                    "atendimento";

            }


            if (
                status ===
                "encerrado"
            ) {

                textoStatus =
                    "Encerrado";

                classeStatus =
                    "encerrado";

            }


            const dataFormatada =
                formatarData(
                    atendimento.criado_em
                );


            const atendente =
                atendimento.atendente ||
                "Aguardando";


            item.innerHTML = `

                <div class="atendimento-nome">

                    <strong>
                        ${escaparHTML(
                            atendimento.cliente_nome ||
                            "Cliente"
                        )}
                    </strong>

                    <span
                        class="badge ${classeStatus}"
                    >
                        ${textoStatus}
                    </span>

                </div>


                <div class="atendimento-info">

                    <span>
                        🧑‍💼
                        ${escaparHTML(
                            atendente
                        )}
                    </span>


                    <span>
                        🕐
                        ${dataFormatada}
                    </span>

                </div>

            `;


            item.onclick =
                () => abrirAtendimento(
                    atendimento
                );


            lista.appendChild(
                item
            );

        }
    );


    iniciarRealtimeAdmin();

}



/* =========================================
   ABRIR ATENDIMENTO
========================================= */

async function abrirAtendimento(
    atendimento
) {

    atendimentoSelecionado =
        atendimento;


    document.getElementById(
        "clienteNome"
    ).textContent =
        atendimento.cliente_nome ||
        "Cliente";


    const status =
        atendimento.status ||
        "aguardando";


    let textoStatus =
        "🟡 Aguardando";


    if (
        status ===
        "em_atendimento"
    ) {

        textoStatus =
            "🟢 Em atendimento";

    }


    if (
        status ===
        "encerrado"
    ) {

        textoStatus =
            "⚫ Encerrado";

    }


    document.getElementById(
        "clienteStatus"
    ).textContent =
        textoStatus;


    document.getElementById(
        "clienteAvatar"
    ).textContent =
        atendimento.atendente ===
        "Atendente 2"
            ? "👨‍💻"
            : "🧑‍💻";


    const encerrado =
        status ===
        "encerrado";


    document.getElementById(
        "resposta"
    ).disabled =
        encerrado;


    document.getElementById(
        "botaoEnviar"
    ).disabled =
        encerrado;


    document.getElementById(
        "botaoEncerrar"
    ).disabled =
        encerrado;


    await carregarMensagens(
        atendimento.id
    );


    carregarAtendimentos();

}



/* =========================================
   CARREGAR MENSAGENS
========================================= */

async function carregarMensagens(
    atendimentoId
) {

    const {

        data,
        error

    } = await db

        .from("mensagens")

        .select("*")

        .eq(
            "atendimento_id",
            atendimentoId
        )

        .order(
            "criado_em",
            {
                ascending:
                    true
            }
        );


    if (error) {

        console.error(
            "Erro ao carregar mensagens:",
            error
        );

        return;

    }


    const area =
        document.getElementById(
            "adminMessages"
        );


    area.innerHTML =
        "";


    if (!data.length) {

        area.innerHTML =
            '<div class="vazio">Nenhuma mensagem ainda.</div>';

        return;

    }


    data.forEach(
        mensagem => {

            mostrarMensagemAdmin(
                mensagem
            );

        }
    );


    area.scrollTop =
        area.scrollHeight;

}



/* =========================================
   MOSTRAR MENSAGEM
========================================= */

function mostrarMensagemAdmin(
    mensagem
) {

    const area =
        document.getElementById(
            "adminMessages"
        );


    const div =
        document.createElement(
            "div"
        );


    div.className =
        "msg " +
        (
            mensagem.remetente ===
            "cliente"
                ? "cliente"
                : "atendente"
        );


    div.textContent =
        mensagem.mensagem;


    if (
        mensagem.criado_em
    ) {

        const horario =
            document.createElement(
                "span"
            );


        horario.className =
            "msg-horario";


        horario.textContent =
            formatarHora(
                mensagem.criado_em
            );


        div.appendChild(
            horario
        );

    }


    area.appendChild(
        div
    );


    area.scrollTop =
        area.scrollHeight;

}



/* =========================================
   ENVIAR RESPOSTA
========================================= */

async function enviarResposta() {

    if (
        !atendimentoSelecionado
    ) {

        return;

    }


    if (
        atendimentoSelecionado.status ===
        "encerrado"
    ) {

        return;

    }


    const campo =
        document.getElementById(
            "resposta"
        );


    const texto =
        campo.value.trim();


    if (!texto) {

        return;

    }


    const {
        error
    } = await db

        .from("mensagens")

        .insert({

            atendimento_id:
                atendimentoSelecionado.id,

            remetente:
                "atendente",

            mensagem:
                texto

        });


    if (error) {

        console.error(
            "Erro ao enviar resposta:",
            error
        );

        return;

    }


    campo.value =
        "";


    /*
       Caso o atendimento ainda esteja
       aguardando, passa para em atendimento.
    */

    if (
        atendimentoSelecionado.status ===
        "aguardando"
    ) {

        const {
            error:
                erroStatus
        } = await db

            .from("atendimentos")

            .update({

                status:
                    "em_atendimento"

            })

            .eq(
                "id",
                atendimentoSelecionado.id
            );


        if (erroStatus) {

            console.error(
                "Erro ao atualizar status:",
                erroStatus
            );

        } else {

            atendimentoSelecionado.status =
                "em_atendimento";

        }

    }


    carregarAtendimentos();

}



/* =========================================
   ENCERRAR
========================================= */

async function encerrarAdmin() {

    if (
        !atendimentoSelecionado
    ) {

        return;

    }


    if (
        atendimentoSelecionado.status ===
        "encerrado"
    ) {

        return;

    }


    const confirmar =
        confirm(
            "Deseja realmente encerrar este atendimento?"
        );


    if (!confirmar) {

        return;

    }


    const {
        error
    } = await db

        .from("atendimentos")

        .update({

            status:
                "encerrado",

            encerrado_em:
                new Date().toISOString()

        })

        .eq(
            "id",
            atendimentoSelecionado.id
        );


    if (error) {

        console.error(
            "Erro ao encerrar atendimento:",
            error
        );

        return;

    }


    atendimentoSelecionado.status =
        "encerrado";


    document.getElementById(
        "clienteStatus"
    ).textContent =
        "⚫ Encerrado";


    document.getElementById(
        "resposta"
    ).disabled =
        true;


    document.getElementById(
        "botaoEnviar"
    ).disabled =
        true;


    document.getElementById(
        "botaoEncerrar"
    ).disabled =
        true;


    carregarAtendimentos();

}



/* =========================================
   REALTIME DO PAINEL
========================================= */

function iniciarRealtimeAdmin() {

    if (canalAdmin) {

        return;

    }


    canalAdmin =

        db

            .channel(
                "admin-atendimentos"
            )

            .on(

                "postgres_changes",

                {

                    event:
                        "*",

                    schema:
                        "public",

                    table:
                        "atendimentos"

                },

                function() {

                    carregarAtendimentos();

                }

            )

            .on(

                "postgres_changes",

                {

                    event:
                        "INSERT",

                    schema:
                        "public",

                    table:
                        "mensagens"

                },

                function(payload) {

                    if (
                        atendimentoSelecionado &&
                        payload.new.atendimento_id ===
                        atendimentoSelecionado.id
                    ) {

                        mostrarMensagemAdmin(
                            payload.new
                        );

                    }

                }

            )

            .subscribe();

}



/* =========================================
   FORMATAR DATA
========================================= */

function formatarData(
    data
) {

    if (!data) {

        return "--";

    }


    return new Date(
        data
    ).toLocaleString(
        "pt-BR",
        {

            day:
                "2-digit",

            month:
                "2-digit",

            hour:
                "2-digit",

            minute:
                "2-digit"

        }
    );

}



/* =========================================
   FORMATAR HORA
========================================= */

function formatarHora(
    data
) {

    if (!data) {

        return "";

    }


    return new Date(
        data
    ).toLocaleTimeString(
        "pt-BR",
        {

            hour:
                "2-digit",

            minute:
                "2-digit"

        }
    );

}



/* =========================================
   SEGURANÇA HTML
========================================= */

function escaparHTML(
    texto
) {

    const div =
        document.createElement(
            "div"
        );


    div.textContent =
        texto;


    return div.innerHTML;

}
